{% extends 'base.html' %}{% block title %}Add listing{% endblock %}{% block content %}<section class="setup-shell"><div class="setup-intro"><span class="eyebrow">{{ business_type_labels.get(engine) }}</span><h1>Add something people can actually act on.</h1><p>This record becomes a public profile, a customer action surface and, when assigned, a QR destination.</p></div><form class="form-card" method="post"><div class="form-grid"><label>Title<input name="title" required></label><label>Category<select name="category">{% for c in categories %}<option>{{ c }}</option>{% endfor %}</select></label><label>Price / rate<input name="price" placeholder="KES 4,500"></label><label>Location<input name="location" value="{{ business.location }}"></label><label>Condition<select name="condition"><option>NEW</option><option>SECOND HAND</option><option>REFURBISHED</option><option>PRE-OWNED</option></select></label><label>Status<select name="status"><option>AVAILABLE</option><option>SOLD</option><option>HELD</option><option>UNAVAILABLE</option></select></label><label class="wide">Image URL<input name="image" placeholder="https://images.unsplash.com/..." required></label><label>Seller / department<input name="seller_name" value="{{ business.name }}"></label><label>Seller phone<input name="seller_phone" value="{{ business.phone }}"></label><label class="wide">Description<textarea name="description" rows="5"></textarea></label><label>Make / room type<input name="make"></label><label>Model / amenity<input name="model"></label><label>Year / extra detail<input name="year"></label><label>Mileage / service<input name="mileage"></label><label>Transmission / booking note<input name="transmission"></label><label>Engine / room amenities<input name="engine"></label></div><div class="form-actions"><a class="btn btn-light" href="{{ url_for('admin') }}">Cancel</a><button class="btn btn-maroon">Publish listing</button></div></form></section>{% endblock %}
