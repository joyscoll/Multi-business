{% extends 'base.html' %}{% block content %}<div class="pos-shell"><section class="pos-main"><div class="row between"><h1>REAL MART POS</h1><span class="status" id="networkStatus">Checking…</span></div><div class="scanbar"><input id="barcode" placeholder="Scan barcode or search product" autofocus><button onclick="searchPOS()">Search</button></div><div id="results"></div><div id="posCart" class="card"><h2>Cart</h2><div id="cartLines"></div><div class="total">TOTAL <span>{{currency}} <span id="cartTotal">0.00</span></span></div><div class="actions"><button onclick="completeSale('CASH')">CASH</button><button onclick="completeSale('MPESA')">M-PESA</button><button onclick="alert('Card terminal adapter placeholder — add provider when ready.')">CARD</button></div></div></section><aside class="sidecard"><h3>Shift</h3><p>Open a cashier shift before live operations.</p><button onclick="openShift()">Open Shift</button><hr><h3>Offline</h3><p>Cash transactions can be queued locally. Actual M-PESA confirmation requires network access.</p></aside></div><script src="/static/js/pos.js"></script>{% endblock %}
