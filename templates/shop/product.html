{% extends 'base.html' %}{% block content %}<article class="product"><img src="{{item.product.image_url or '/static/pwa/icon.svg'}}"><div><h1>{{item.product.name}}</h1><p>{{item.product.description or ''}}</p><h2>{{currency}} {{'%.2f'|format(item.selling_price|float)}}</h2><p>Stock: {{item.stock_quantity}}</p><button onclick="addToCart('{{item.id}}','{{item.product.name|e}}',{{item.selling_price}})">Add to cart</button></div></article>{% endblock %}
