{% extends 'base.html' %}{% block content %}<div class="product"><div class="product-media"><img src="{{item.product.image_url or '/static/pwa/icon.svg'}}" alt="{{item.product.name}}"></div><div class="buybox"><div class="eyebrow">{{store.name if store else 'ONLINE SHOP'}}</div><h1>{{item.product.name}}</h1><div class="mini-brand">{{item.product.brand or 'Everyday essential'}}</div><div class="price big-price">{{currency}} {{'%.2f'|format(item.selling_price|float)}}</div><p class="muted">Available while stock lasts.</p><div class="buyrow"><button class="primary" onclick="addToCart('{{item.id}}','{{item.product.name|e}}',{{item.selling_price}})">Add to basket</button><a href="/cart" class="button soft">Basket</a></div></div></div>{% endblock %}
