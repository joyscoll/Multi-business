{% extends 'base.html' %}{% block content %}<script>window.REAL_MART_STORE={{(store.code if store else '')|tojson}};</script><section class="catalogue-head"><div><span class="eyebrow">CHECKOUT</span><h1>Place your order</h1><p>Only the details needed to fulfil it.</p></div></section><div class="checkout-layout"><section class="checkout-form clean-form"><label>Full name<input id="custName" autocomplete="name" required></label><label>Phone number<input id="custPhone" autocomplete="tel" inputmode="tel" placeholder="07xx xxx xxx" required></label><label>Email <em>optional</em><input id="custEmail" autocomplete="email" type="email"></label><label>Delivery / pickup details<textarea id="deliveryAddress" rows="4" placeholder="Estate, building, road, or pickup instructions"></textarea></label><button class="primary-btn full" onclick="placeOrder()">Place order & continue to payment</button></section><aside class="checkout-card"><div class="checkout-label">YOUR ORDER</div><div id="checkoutSummary"></div><div class="checkout-total"><span>Total</span><strong>KES <span id="checkoutTotal">0.00</span></strong></div></aside></div>{% endblock %}
