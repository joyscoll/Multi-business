{% extends 'base.html' %}{% block content %}<script>window.REAL_MART_STORE={{ (store.code if store else "")|tojson }};</script><section class="catalogue-top"><div><div class="eyebrow">CHECKOUT</div><h1>Place your order.</h1></div></section><div class="checkout-layout"><section class="checkout-form"><label>Full name<input id="custName" required></label><label>Phone number<input id="custPhone" required inputmode="tel"></label><label>Email <span class="muted">optional</span><input id="custEmail" type="email"></label><label>Delivery / pickup details<textarea id="deliveryAddress" rows="4" placeholder="Delivery location or pickup note"></textarea></label><button class="big-add" onclick="placeOrder()">Place order</button></section><aside class="checkout-card"><div class="eyebrow">BASKET</div><div id="checkoutSummary"></div><div class="checkout-total"><span>Total</span><strong>{{currency}} <span id="checkoutTotal">0.00</span></strong></div></aside></div>{% endblock %}
