<article class="product-card"><a class="product-image {% if not item.product.image_url %}no-photo{% endif %}" href="{{url_for('shop.product',slug=item.product.slug)}}?store={{store.code if store else ''}}">{% if item.product.image_url %}<img loading="lazy" src="{{item.product.image_url}}" alt="{{item.product.name}}" onerror="this.closest('.product-image').classList.add('no-photo');this.remove();">{% else %}<span class="product-initials">{{(item.product.brand or item.product.name)[:2]|upper}}</span>{% endif %}</a><div class="product-info"><span class="product-brand">{{item.product.brand or 'Household'}}</span><a class="product-title" href="{{url_for('shop.product',slug=item.product.slug)}}?store={{store.code if store else ''}}">{{item.product.name}}</a><div class="product-bottom"><strong>KES {{'%.0f'|format(item.selling_price|float)}}</strong><button type="button" onclick="addToCart('{{item.id}}','{{item.product.name|e}}',{{item.selling_price}})">Add</button></div></div></article>
