<article class="product-tile"><a class="product-photo" href="/product/{{item.product.slug}}?store={{store.code if store else ''}}"><img loading="lazy" decoding="async" src="{{item.product.image_url or '/static/pwa/icon.svg'}}" alt="{{item.product.name}}" loading="lazy" onerror="this.onerror=null;this.src='/static/pwa/icon.svg';"></a><div class="product-copy"><div class="product-meta">{{item.product.brand or item.product.unit or 'Item'}}</div><a class="product-name" href="/product/{{item.product.slug}}?store={{store.code if store else ''}}">{{item.product.name}}</a><div class="product-buy"><strong>{{currency}} {{'%.0f'|format(item.selling_price|float)}}</strong><button type="button" onclick="addToCart('{{item.id}}','{{item.product.name|e}}',{{item.selling_price}})">+</button></div></div></article>
