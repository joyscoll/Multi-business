{% extends 'base.html' %}
{% block content %}<div class="section-head"><div><div class="eyebrow">YOUR BASKET</div><h1 style="margin:.2rem 0">Ready when you are.</h1><div class="muted">Your basket stays on this device while you browse.</div></div></div><div class="cart-layout"><div class="panel"><div id="cart"></div></div><aside class="panel"><h3>Next step</h3><p class="muted">Continue to checkout when your basket is complete.</p><a class="primary" href="/checkout">Checkout</a></aside></div>{% endblock %}
{% block scripts %}<script>function renderPublicCart(){const c=getCart();const el=document.getElementById('cart');if(!c.length){el.innerHTML='<div class="empty">Your basket is empty. <a href="/shop">Start shopping</a>.</div>';return}let total=0;el.innerHTML=c.map((x,i)=>{const line=x.price*x.quantity;total+=line;return `<div class="cart-line"><div><b>${x.name}</b><small>Qty ${x.quantity}</small></div><div><strong>{{currency}} ${line.toFixed(2)}</strong> <button class="button soft" onclick="removeCart(${i})">Remove</button></div></div>`}).join('')+`<div class="total" style="display:flex;justify-content:space-between;font-size:1.5rem;font-weight:950;padding-top:18px">Total <span>{{currency}} ${total.toFixed(2)}</span></div>`}function removeCart(i){const c=getCart();c.splice(i,1);saveCart(c);renderPublicCart();updateCartCount()}document.addEventListener('DOMContentLoaded',renderPublicCart);</script>{% endblock %}
