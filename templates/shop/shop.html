{% extends 'base.html' %}{% block content %}<div class="row between"><h1>Shop</h1><form><input name="q" value="{{q}}" placeholder="Search milk, bread, barcode..."><button>Search</button></form></div><div class="grid">{% for item in products %}<article class="card"><img src="{{item.product.image_url or '/static/pwa/icon.svg'}}" alt="{{item.product.name}}"><h3>{{item.product.name}}</h3><div>{{currency}} {{'%.2f'|format(item.selling_price|float)}}</div><a href="/product/{{item.product.slug}}">View</a></article>{% else %}<p>No products found. Seed/import the catalogue from Admin.</p>{% endfor %}</div>{% endblock %}
