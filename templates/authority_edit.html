{% extends 'base.html' %}{% block title %}Edit · Authority{% endblock %}{% block content %}<section class="page-head"><span class="eyebrow">Authority</span><h1>Edit business record</h1></section><form class="form-grid" method="post">{% if current_kind=='vehicles' %}<label>Title<input name="title" value="{{item.title}}" required></label><label>Make<input name="make" value="{{item.make}}"></label><label>Model<input name="model" value="{{item.model}}"></label><label>Year<input name="year" value="{{item.year}}"></label><label>Mileage<input name="mileage" value="{{item.mileage}}"></label><label>Price<input name="price" value="{{item.price}}"></label><label>Condition<input name="condition" value="{{item.condition}}"></label><label>Location<input name="location" value="{{item.location}}"></label><label class="wide">Description<textarea name="description">{{item.description}}</textarea></label><label class="wide">Image URL<input name="image" value="{{item.image}}"></label><label>Status<select name="status"><option>AVAILABLE</option><option>SOLD</option><option>HOLD</option></select></label>{% elif current_kind=='hotels' %}<label>Room number<input name="room_number" value="{{item.room_number}}" required></label><label>Room type<input name="room_type" value="{{item.room_type}}"></label><label>Price<input name="price" value="{{item.price}}"></label><label>Status<select name="status"><option>AVAILABLE</option><option>OCCUPIED</option><option>MAINTENANCE</option><option>RESERVED</option></select></label><label class="wide">Services / details<textarea name="details">{{item.details}}</textarea></label><label class="wide">Image URL<input name="image" value="{{item.image}}"></label>{% else %}<label>Title<input name="title" value="{{item.title}}" required></label><label>Category<input name="category" value="{{item.category}}"></label><label>Price<input name="price" value="{{item.price}}"></label><label>Location<input name="location" value="{{item.location}}"></label><label class="wide">Description<textarea name="description">{{item.description}}</textarea></label><label class="wide">Image URL<input name="image" value="{{item.image}}"></label><label>Status<select name="status"><option>AVAILABLE</option><option>UNDER OFFER</option><option>SOLD</option></select></label>{% endif %}<div class="wide actions"><button class="primary">Save changes</button></div></form>{% endblock %}
