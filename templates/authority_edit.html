}selected{% endif %}>OCCUPIED</option><option {% if item.status=='MAINTENANCE' %}selected{% endif %}>MAINTENANCE</option><option {% if item.status=='RESERVED' %}selected{% endif %}>RESERVED</option></select></label><label class="wide">Services / details<textarea name="details">{{item.details}}</textarea></label><label class="wide">Image URL<input name="image" value="{{item.image}}"></label>{% else %}<label>Title<input name="title" value="{{item.title}}" required></label><label>Property type<select name="category">{% for t in type_catalog %}<option {% if item.category==t %}selected{% endif %}>{{t}}</option>{% endfor %}</select></label><label>Price<input name="price" value="{{item.price}}"></label><label>Location<input name="location" value="{{item.location}}"></label><label class="wide">Description<textarea name="description">{{item.description}}</textarea></label><label class="wide">Image URL<input name="image" value="{{item.image}}"></label><label>Status<select name="status"><option {% if item.status=='AVAILABLE' %}selected{% endif %}>AVAILABLE</option><option {% if item.status=='UNDER OFFER' %}selected{% endif %}>UNDER OFFER</option><option {% if item.status=='SOLD' %}selected{% endif %}>SOLD</option></select></label>{% endif %}<div class="wide actions"><button class="primary">Save changes</button></div></form>{% endblock %}
