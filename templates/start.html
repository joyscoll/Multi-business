<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Start · MultiBusiness</title><link rel="stylesheet" href="{{ url_for("static",filename="css/app.css") }}?v=4"></head><body class="start-only"><div id="splash" class="splash"><div class="signature">MultiBusiness</div><div class="splash-line"></div><small>Choose your business</small></div><main class="start-page"><div class="start-card"><span class="eyebrow">MULTIBUSINESS · START</span><h1>Choose your business.</h1><p>One choice creates one independent business world. Its visitor site, operations and Authority portal remain inside that business.</p><form method="post"><label>Business type<select name="business_type" required><option value="">Select business type</option>{% for key,label,desc in business_types %}<option value="{{ key }}">{{ label }}</option>{% endfor %}</select></label><button class="btn btn-maroon wide-btn">Done · Continue</button></form></div></main><script src="{{ url_for("static",filename="js/app.js") }}?v=4"></script></body></html>
