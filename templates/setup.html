{% extends 'base.html' %}{% block title %}Set up {{type_info.name}}{% endblock %}{% block content %}<section class="page-head"><span class="eyebrow">{{type_info.name}}</span><h1>Build your business home</h1><p>This is the private setup before the public business opens.</p></section><form class="form-grid" method="post"><label>Business name<input name="name" value="{{business.name}}" required></label><label>Description<textarea name="description">{{business.description}}</textarea></label><label>Location<input name="location"></label><label>Phone<input name="phone"></label><label>WhatsApp<input name="whatsapp"></label><label>Email<input name="email" type="email"></label><label>Website / social<input name="website"></label><label>Logo initials<input name="logo" value="{{business.logo or type_info.name[0]}}" maxlength="2"></label><label class="wide">Cover image URL<input name="cover_image"></label><label class="wide">Payment destination / instructions<input name="payment_destination" placeholder="Till, Paybill, bank or booking/payment instructions"></label><div class="wide actions"><button class="primary">Open my business</button></div></form>{% endblock %}
