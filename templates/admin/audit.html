{% extends 'base.html' %}{% block chrome %}<header class="secure-top admin-secure"><div class="secure-brand">{{business_name}} · Control centre</div><form method="post" action="/logout" class="inline"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="secure-logout">Log out</button></form></header>{% endblock %}{% block content %}<h1>Audit Log</h1><div class="table-wrap"><table><tr><th>Time</th><th>Action</th><th>Entity</th><th>User</th></tr>{% for log in logs %}<tr><td>{{log.created_at}}</td><td>{{log.action}}</td><td>{{log.entity_type}} {{log.entity_id}}</td><td>{{log.user_id}}</td></tr>{% endfor %}</table></div>{% endblock %}
